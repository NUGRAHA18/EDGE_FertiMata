# Rotasi log journald (F10.5). Dipasang oleh deploy/install.sh ke
# /etc/systemd/journald.conf.d/fertimata.conf. Berlaku untuk seluruh Jetson, bukan hanya agent.
#
# Log disimpan permanen (tetap ada setelah listrik padam) tapi dibatasi supaya tidak bersaing
# dengan foto patroli (camera.disk_*) dan database backend di SSD yang sama.
#   journalctl --disk-usage
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=5G
SystemMaxFileSize=64M
MaxRetentionSec=3month
