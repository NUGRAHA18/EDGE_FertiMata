[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fertimata-edge"
version = "0.1.0"
description = "Edge agent FertiMata: jembatan backend (MQTT) dan hardware greenhouse melon (RS485/GPIO/kamera)"
readme = "README.md"
# Target produksi Jetson: Python 3.10 (Ubuntu 22.04). Jangan pakai fitur > 3.10.
requires-python = ">=3.10"
# Versi dikunci persis supaya Jetson dan laptop memakai pustaka yang sama.
dependencies = [
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    "paho-mqtt==2.1.0",
    "pymodbus==3.16.1",
    "pyserial==3.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[project.scripts]
fertimata-edge = "fertimata_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # teks Indonesia memakai tanda seperti "×" dan "–"
